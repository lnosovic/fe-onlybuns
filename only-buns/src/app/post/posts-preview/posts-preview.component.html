<div class="post-container flex flex-col items-center p-4 bg-base-200 min-h-screen">
    <div class="post card card-compact lg:card-normal bg-base-100 shadow-xl rounded-box mb-6 w-full max-w-lg" *ngFor="let post of posts">
        <div class="card-body p-4">
            <div class="post-header flex justify-between items-center mb-2">
                <!-- Leva strana: username -->
                <span class="post-user text-lg font-semibold text-primary cursor-pointer" (click)="viewProfile(post.userId)">
                  &commat;{{usernames[post.userId]}}
                </span>
              
                <!-- Desna strana: lokacija + meni -->
                <div class="flex items-center gap-2">
                  <!-- Lokacija -->
                  <span class="post-location text-sm text-gray-500 flex items-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4 text-gray-400">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                      <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
                    </svg>
                    {{post.location.city}}
                  </span>
              
                  <!-- Meni (vidljiv samo ako je korisnik vlasnik posta) -->
                  <div class="relative" *ngIf="post.userId === currentUser?.id || isAdmin()">
                    <button class="btn btn-ghost btn-sm px-2" (click)="togglePostMenu(post)">
                      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-500 hover:text-gray-700" viewBox="0 0 24 24" fill="currentColor">
                        <circle cx="12" cy="5" r="1.5" />
                        <circle cx="12" cy="12" r="1.5" />
                        <circle cx="12" cy="19" r="1.5" />
                      </svg>
                    </button>
              
                    <div *ngIf="activePostMenu === post" class="absolute right-0 mt-2 w-28 bg-base-100 border border-base-200 shadow-lg rounded-md z-50">
                      <ul class="menu menu-sm w-full">
                        <li><a *ngIf="!isAdmin()" (click)="startEditing(post)">Edit</a></li>
                        <li><a (click)="deletePost(post)">Delete</a></li>
                      </ul>
                    </div>
                  </div>
                </div>
              </div>
            
              <div class="post-description text-base mb-4">
                <!-- Ako se edituje -->
                <ng-container *ngIf="editingPostId === post.id; else viewMode">
                  <textarea
                    [(ngModel)]="editedDescription"
                    class="textarea textarea-bordered w-full"
                    rows="2"
                    #descInput
                    (keydown.enter)="submitEdit(post)"
                    (blur)="submitEdit(post)">
                  </textarea>
                </ng-container>
              
                <!-- Inače samo prikaz -->
                <ng-template #viewMode>
                  <p (dblclick)="startEditing(post)" class="cursor-pointer">
                    <b class="post-user text-primary cursor-pointer" (click)="viewProfile(post.userId)"></b>
                    {{post.description}}
                  </p>
                </ng-template>
              </div>
            <figure class="post-image cursor-pointer mb-4 rounded-box overflow-hidden">
                <img [src]="'https://www.protexinvet.com/userfiles/image/cute-2500929_1920_1_light.jpg'" alt="Post Image" class="w-full h-auto object-cover max-h-96" />
            </figure>
            
            <div class="post-actions flex items-center justify-start gap-4 mb-2 border-t border-base-200 pt-3">

                <button class="btn btn-ghost btn-sm flex items-center gap-1 hover:bg-red-100 hover:text-red-500 rounded-full group" (click)="toggleLike(post)">
                    <ng-container *ngIf="post.isLikedByUser">

                        <svg class="w-5 h-5 text-red-500 transition-all duration-200 ease-in-out group-hover:scale-110" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                        </svg>
                    </ng-container>
                    <ng-container *ngIf="!post.isLikedByUser">

                        <svg class="w-5 h-5 text-gray-500 transition-all duration-200 ease-in-out group-hover:text-red-500 group-hover:scale-110" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
                        </svg>
                    </ng-container>
                    <span class="text-sm font-medium">{{post.likes}}</span> 
                </button>
                
                <button 
                    class="btn btn-ghost btn-sm flex items-center gap-1 rounded-full group 
                           transition-colors duration-200 ease-in-out 
                           "
                    [ngClass]="{
                        'bg-blue-100 text-blue-500': showComments && selectedPost === post,
                        'hover:bg-blue-100 hover:text-blue-500': !(showComments && selectedPost === post)
                    }"
                    (click)="toggleComments(post)">
  
                    <svg class="w-5 h-5 transition-all duration-200 ease-in-out group-hover:scale-110" 
                         [ngClass]="{
                             'text-blue-500 fill-current': showComments && selectedPost === post,
                             'text-gray-500 group-hover:text-blue-500': !(showComments && selectedPost === post)
                         }"
                         [attr.fill]="(showComments && selectedPost === post) ? 'currentColor' : 'none'"
                         stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                    </svg>
                    <span class="text-sm font-medium"
                          [ngClass]="{
                              'text-blue-500': showComments && selectedPost === post,
                              'text-gray-500 group-hover:text-blue-500': !(showComments && selectedPost === post)
                          }">
                        {{post.comments.length}}
                    </span> 
                </button>
            </div>
            
            <div *ngIf="showComments && selectedPost===post" class="post-comments border-t border-base-200 pt-4 mt-4">
                <div class="close-comments flex justify-end mb-4">
                    <button class="btn btn-sm btn-ghost" (click)="closeComments(post)">
                         
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4 ml-1">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                        </svg>                          
                    </button>
                </div>
                <div class="comments-list max-h-48 overflow-y-auto mb-4">
                    <div *ngFor="let comment of post.comments" class="comment p-2 border-b border-base-200 last:border-b-0">
                        <p><span class="comment-user font-semibold text-secondary cursor-pointer" (click)="viewProfile(comment.userId)">&commat;{{comment.creatorUsername}}</span>: {{comment.text}}</p>
                    </div>
                </div>
                <div class="add-comment flex items-center gap-2">
                    <input type="text" placeholder="Post your comment..." class="input input-bordered input-sm w-full flex-grow" />
                    <button (click)="addComment()" class="btn btn-primary btn-sm">Comment</button>
                </div>
            </div>
        </div>
    </div>
</div>

<dialog #deleteDialog class="modal" [open]="postToDelete !== null">
    <div class="modal-box">
      <h3 class="font-bold text-lg">Are you sure?</h3>
      <p class="py-4">Do you really want to delete this post?</p>
      <div class="modal-action">
        <button class="btn btn-error" (click)="confirmDelete()">Yes</button>
        <button class="btn" (click)="cancelDelete()">No</button>
      </div>
    </div>
  </dialog>
