<div class="min-h-screen bg-base-200 flex items-center justify-center">
  <div class="card w-full max-w-sm shrink-0 bg-base-100 shadow-2xl">
    <form [formGroup]="loginForm" (ngSubmit)="login()" class="card-body">

      <h2 class="card-title text-2xl font-bold justify-center">
        Login
      </h2>

      <div class="form-control">
        <label class="label" for="email">
          <span class="label-text">Email</span>
        </label>
        <input
          id="email"
          type="text"
          formControlName="email"
          placeholder="Enter your email"
          class="input input-bordered"
          [class.input-error]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
        />
      </div>

      <div class="form-control">
        <label class="label" for="password">
          <span class="label-text">Password</span>
        </label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Enter your password"
          class="input input-bordered"
          [class.input-error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
        />
      </div>

      <div class="form-control mt-6">
        <button 
            type="submit" 
            class="btn btn-outline btn-primary w-full" 
            [disabled]="!loginForm.valid">
            Login
        </button>
        <div *ngIf="loginErrorMessage" class="text-red-600 text-sm text-center mt-2">
          {{ loginErrorMessage }}
        </div>
      </div>
      <div class="text-center mt-4">
        <p class="text-sm">
          Don't have an account?
          <a (click)="signUp()" class="link link-primary">Sign up now</a>
        </p>
      </div>

    </form>
  </div>
</div>
