<form [formGroup]="registrationForm" class="registration-form">
    <div class="form-container">
        <div class="form-group">
            <label for="name">Name:</label>
            <input id="name" formControlName="name" type="text" placeholder="Enter your name"/>
        </div>
        <div class="form-group">
            <label for="surname">Surname:</label>
            <input id="surname" formControlName="surname" type="text" placeholder="Enter your surname"/>
        </div>
        <div class="form-group">
            <label for="username">Username:</label>
            <input id="username" formControlName="username" type="text" placeholder="Enter your username"/>
        </div>
        <div class="form-group">
            <label for="email">Email:</label>
            <input id="email" formControlName="email" type="text" placeholder="Enter your email"/>
        </div>
        <div class="form-group">
            <label for="password">Password:</label>
            <input id="password" formControlName="password" type="password" placeholder="Enter your password" />
        </div>
        <div class="form-group">
            <label for="confirmPassword">Confirm Password:</label>
            <input id="confirmPassword" formControlName="confirmPassword" type="password" placeholder="Confirm your password"/>
        </div>
        <div class="form-group location-row" *ngIf="SelectedLocation">
        <div class="location-field">
            <label>City:</label>
            <input type="text" [value]="SelectedLocation.city" readonly />
        </div>
        <div class="location-field">
            <label>Country:</label>
            <input type="text" [value]="SelectedLocation.country" readonly />
        </div>
        </div>
        <app-map (locationSelected)="onLocationSelected($event)" [reset]="mapResetTrigger"></app-map>
        <div class="form-actions">
            <button  type="submit" [disabled]="registrationForm.invalid || !SelectedLocation" (click)="registerUser()">Sign Up</button>
        </div>
    </div>
</form>
