<app-navbar></app-navbar>
<router-outlet></router-outlet>

<app-chat-widget *ngIf="isAuthenticated()" (openChatRoom)="handleOpenChatRoom($event)"></app-chat-widget>

<app-chat-window
  *ngFor="let w of openChatWindows"
  [chatRoomId]="w.id"
  [chatRoomName]="w.name"
  [style.right.px]="w.position.right"
  [style.bottom.px]="w.position.bottom"
  (closeWindow)="handleCloseChatWindow($event)"
  class="fixed z-40">
</app-chat-window>
