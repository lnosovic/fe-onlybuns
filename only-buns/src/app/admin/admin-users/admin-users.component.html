<div class="w-full flex justify-center mt-8 px-4">
    <div class="w-full max-w-[50%]">
  
      <!-- Filter forma -->
      <div class="card bg-base-100 shadow-md p-4 space-y-4">
  
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <input type="text" [(ngModel)]="criteria.name" placeholder="Name" class="input input-bordered w-full" />
          <input type="text" [(ngModel)]="criteria.surname" placeholder="Surname" class="input input-bordered w-full" />
          <input type="text" [(ngModel)]="criteria.email" placeholder="Email" class="input input-bordered w-full" />
        </div>
  
        <div class="grid grid-cols-2 gap-4">
          <input type="number" [(ngModel)]="criteria.minPostCount" placeholder="Min posts" class="input input-bordered w-full" />
          <input type="number" [(ngModel)]="criteria.maxPostCount" placeholder="Max posts" class="input input-bordered w-full" />
        </div>
  
        <div class="flex gap-4 items-center">
          <select [(ngModel)]="criteria.sortBy" class="select select-bordered">
            <option value="" disabled selected>Sort by</option>
            <option value="followerCount">Following</option>
            <option value="email">Email</option>
          </select>
          <select [(ngModel)]="criteria.sortDirection" class="select select-bordered">
            <option value="asc">Ascending</option>
            <option value="desc">Descending</option>
          </select>
        </div>
  
        <div class="flex justify-end">
          <button class="btn btn-primary" (click)="searchUsers()">Search</button>
        </div>
      </div>
  
      <!-- Lista korisnika -->
      <div class="space-y-4 mt-6">
        <div *ngFor="let user of users" class="card bg-base-200 shadow-sm p-4">
          <div class="flex justify-between items-center">
            <div>
              <h3 class="font-semibold text-lg">{{ user.name }} {{ user.surname }}</h3>
              <p class="text-sm text-gray-500">{{ user.email }}</p>
            </div>
            <div class="text-right text-sm">
              <p>Posts: <span class="font-medium">{{ user.postCount }}</span></p>
              <p>Following: <span class="font-medium">{{ user.followingCount }}</span></p>
            </div>
          </div>
        </div>
      </div>
  
      <!-- Paginacija -->
      <div class="join flex justify-center mt-6" *ngIf="totalPages > 1">
        <button class="join-item btn" [disabled]="criteria.page === 0" (click)="changePage(criteria.page! - 1)">«</button>
        <button class="join-item btn" *ngFor="let i of [].constructor(totalPages); let idx = index"
          [class.btn-active]="criteria.page === idx"
          (click)="changePage(idx)">
          {{ idx + 1 }}
        </button>
        <button class="join-item btn" [disabled]="criteria.page! >= totalPages - 1" (click)="changePage(criteria.page! + 1)">»</button>
      </div>
  
    </div>
  </div>
